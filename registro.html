<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | Huellitas Felices</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" href="images/logo.png" type="image/png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

    <!-- Encabezado con logo y barra de navegación -->
    <header class="header">
        <div class="nav-bar">
            <img src="images/logo.png" alt="Logo de Huellitas Felices" class="logo">
            <div class="header-contenido">
                <h1 class="title">Huellitas Felices</h1>
                <nav class="nav">
                    <ul class="lista">
                        <li><a href="index.html">Inicio</a></li>
                        <li><a href="catalogo.html">Adoptar</a></li>
                        <li><a href="#contacto">Contacto</a></li>
                        <li><a href="solicitudes.html">Mis Solicitudes</a></li>
                    </ul>

                    <!-- si no estas logueado -->
                    <div id="nav-visitante" class="auth-buttons">
                        <div class="button-login">
                            <a href="login.html">Iniciar Sesión</a>
                        </div>
                        <div class="button-register">
                            <a href="registro.html">Registrarse</a>
                        </div>
                    </div>

                    <!-- si ya iniciaste sesion -->
                    <div id="nav-usuario" style="display: none; align-items: center; gap: 15px;">
                        <span id="nav-saludo" style="font-weight: bold;"></span>
                        <button id="btn-cerrar-sesion" class="btn-principal" style="padding: 5px 15px; font-size: 2rem; cursor: pointer;">Cerrar Sesión</button>
                    </div>
                </nav>
            </div>
        </div>
    </header>


    <main class="contenedor-centrado">
        <div class="tarjeta-auth">
            <h2>Crear una Cuenta</h2>
            
            <form id="formulario-registro">
                <div class="grupo-input">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" required placeholder="Ej: Juan Pérez">
                </div>

                <div class="grupo-input">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" required placeholder="ejemplo@correo.com">
                </div>

                <div class="grupo-input">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required placeholder="Mínimo 6 caracteres">
                </div>

                <button type="submit" class="btn-principal" style="width: 100%; margin-top: 15px;">Registrarme</button>
                
                <p id="mensaje-auth" style="text-align: center; margin-top: 15px; color: red;"></p>
            </form>

            <p style="text-align: center; margin-top: 20px;">
                ¿Ya tenés cuenta? <a href="login.html" style="color: var(--secondary-color); font-weight: bold;">Iniciá sesión acá</a>
            </p>
        </div>
    </main>

    <!-- Footer y Contacto -->
    <footer class="pie-de-pagina" id="contacto">
        <div class="footer-ola">
            <svg viewBox="0 0 1440 120" preserveAspectRatio="none" aria-hidden="true">
                <path d="M0,64L80,69.3C160,75,320,85,480,80C640,75,800,53,960,48C1120,43,1280,53,1360,58.7L1440,64L1440,120L1360,120C1280,120,1120,120,960,120C800,120,640,120,480,120C320,120,160,120,80,120L0,120Z" fill="var(--primary-color)"></path>
            </svg>
        </div>

        <div class="footer-contenido">
            <div class="footer-marca">
                <img src="images/logo.png" alt="Logo Huellitas Felices" class="logo-footer">
                <h3>Huellitas Felices</h3>
            </div>

            <div class="footer-contacto">
                <div class="contacto-item">
                    <i class="fa-solid fa-location-dot icono" aria-hidden="true"></i>
                    <p>Pepito 8345, 6A<br>Buenos Aires, Argentina</p>
                </div>
                <div class="contacto-item">
                    <i class="fa-solid fa-phone icono" aria-hidden="true"></i>
                    <p>+54 (11) 1234-4321</p>
                </div>
                <div class="contacto-item">
                    <i class="fa-solid fa-envelope icono" aria-hidden="true"></i>
                    <p>info@huellitasfelices.com</p>
                </div>
            </div>
        </div>
    </footer>

    <!-- Supabase CDN y script exclusivo de autenticación -->
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="js/auth.js"></script>
    <script src="js/nav.js"></script>
</body>
</html>
